# Ribi OS compositor settings (picom).
#
# This config is deliberately conservative. The live image runs picom with the
# xrender backend on software/virtio GPUs, where several "nice to have" options
# are known to break window painting: with unredir-if-possible,
# detect-rounded-corners, or an inactive-opacity below 1.0, unfocused windows
# could stop being painted entirely and only reappear for a moment when clicked.
# Every option below either has no effect on which pixels are painted or only
# adds a drop shadow, so a window is always drawn at full opacity.
#
# The xrender backend is required: glx/EGL are not reliable on the QEMU and
# basic-framebuffer hardware this image targets.
backend = "xrender";
vsync = false;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "name = 'ribi-launcher-window'",
  "class_g = 'Ribi'",
];

# No rounded corners and no fading. Both are cosmetic and both have been
# observed to leave stale/blank regions on the software render path.
corner-radius = 0;
fading = false;

# Every window is fully opaque, focused or not. Do not lower these values:
# inactive windows were rendering invisible at 0.97 on the live image.
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-dim = 0.0;

# Never take the whole screen out of the compositing pipeline; unredirecting is
# the single most common cause of "my window disappeared" on this stack.
unredir-if-possible = false;
