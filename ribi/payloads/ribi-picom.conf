# Ribi OS compositor settings (picom). xrender keeps it working on the
# software/virtio GPUs the live image boots on; glx is faster where available.
backend = "xrender";
vsync = false;

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "class_g = 'Ribi'",
  "name = 'ribi-launcher-window'",
];

corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "name = 'ribi-launcher-window'",
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

inactive-opacity = 0.97;
active-opacity = 1.0;
frame-opacity = 1.0;

detect-rounded-corners = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
unredir-if-possible = true;
