name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests (split integrity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: python -m pip install --upgrade pip pytest

      - name: Compile all modules
        run: python -m py_compile ribi/*.py ribi/sources/*.py ribi-iso-builder.py

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: CLI smoke test
        run: python ribi-iso-builder.py --version

  build-iso:
    name: Build ISO + QEMU boot-test (BIOS + UEFI)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc flex bison libelf-dev libssl-dev \
            xorriso squashfs-tools mtools rsync cpio xz-utils \
            grub-pc-bin grub-efi-amd64-bin grub-common \
            dosfstools e2fsprogs util-linux imagemagick \
            patch elf patchelf \
            qemu-system-x86 ovmf

      - name: Verify host dependencies
        run: sudo -E python3 ribi-iso-builder.py --check-deps

      - name: Build ISO
        run: sudo -E python3 ribi-iso-builder.py --build
        timeout-minutes: 180

      - name: Boot-test in QEMU
        run: sudo -E python3 ribi-iso-builder.py --boot-test
        timeout-minutes: 15
        continue-on-error: true

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ribi-os-iso
          path: ribi-os-*.iso
          if-no-files-found: error
          retention-days: 14
